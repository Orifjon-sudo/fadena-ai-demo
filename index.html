 el('#nav').innerHTML=Object.keys(views).map(id=>'<a '+(v===id?'aria-current="page"':'')+' href="#'+id+'">'+icon(views[id][2])+'<span>'+title(id)+'</span></a>').join('');
 el('#access').textContent=key?L('Выйти','Chiqish'):L('Войти','Kirish');
 el('#view').innerHTML='<h1 class="heading">'+title(v)+'</h1>'+({overview,agents:agentView,search:searchView,clients:mapView,analytics,reports,journal,settings}[v])();el('#notice').textContent=lastMessage;
}
function login(){el('#loginTitle').textContent=L('Вход в центр','Markazga kirish');el('#keyLabel').textContent=L('Ключ оператора','Operator kaliti');el('#enter').textContent=L('Войти','Kirish');el('#cancel').textContent=L('Отмена','Bekor qilish');el('#loginError').textContent='';el('#key').value='';el('#login').showModal();}
el('#credentials').onsubmit=async e=>{e.preventDefault();key=el('#key').value.trim();el('#key').value='';el('#enter').disabled=true;try{workspace=await api('workspace');tg=await api('integration');el('#login').close();render();}catch{clearSession();el('#loginError').textContent=L('Вход не выполнен. Проверьте ключ и соединение.','Kirish amalga oshmadi. Kalit va aloqani tekshiring.');}finally{el('#enter').disabled=false;}};
el('#cancel').onclick=()=>el('#login').close();
el('#access').onclick=()=>{if(key){clearSession();render();}else login();};
window.addEventListener('hashchange',()=>{lastMessage='';render();});
el('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('fadena_lang',lang);render();};
el('#theme').onchange=e=>{document.body.dataset.theme=e.target.value;localStorage.setItem('fadena_theme',e.target.value);};
el('#view').onchange=e=>{if(e.target.id==='region'){region=e.target.value;city=Object.keys(status.markets[region].cities)[0];render();}if(e.target.id==='city')city=e.target.value;if(e.target.id==='category')category=e.target.value;};
el('#view').onclick=async e=>{
 const id=e.target.closest('[data-action]')?.dataset.action;if(!id)return;
 if(id.startsWith('tg-')){
 if(busy)return;
 if(id==='tg-send'&&!confirm(L('Разрешаете отправить одно сообщение во второй тестовый чат?','Sinov chatiga bitta xabar yuborilsinmi?')))return;
 const body=id==='tg-save'?{name:el('#tgName').value.trim(),worker:el('#tgWorker').value.trim()}:{confirm:id==='tg-send'};
 busy=true;
 try{tg=await api('integration/'+id.slice(3),{body});lastMessage=tg.message||L('Настройки сохранены.','Sozlamalar saqlandi.');}catch(e){lastMessage=e.message==='Failed to fetch'?'Нет связи с Worker.':e.message;}
 finally{busy=false;render();}return;
 }
 if(id==='login')return login();if(id==='refresh')return refresh();
 if(id.startsWith('agent-'))selected=Number(id.slice(6));
 if(id==='fit')focusId='';
 if(id.startsWith('point-'))focusId=workspace.leads.filter(x=>Number.isFinite(x.lon)&&Number.isFinite(x.lat))[Number(id.slice(6))].id;
 if(id==='run'&&!busy){busy=true;render();try{const r=await api('research',{body:{country:region,city,category}});lastMessage=L('Найдено: ','Topildi: ')+r.total+' · '+L('Новых: ','Yangi: ')+r.created;}catch{lastMessage=L('Поиск не завершён. Проверьте журнал.','Qidiruv tugamadi. Jurnalni tekshiring.');}finally{busy=false;await refresh();}return;}
 if(id.startsWith('file-')){try{const kind=id.slice(5);const blob=await api('reports/'+kind,{file:true});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FADENA-report.'+kind;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000);}catch{lastMessage=L('Загрузка недоступна.','Yuklab bo‘lmadi.');}}
 render();
};
el('#view').onkeydown=e=>{if(e.target.matches('circle[data-action]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}};
document.body.dataset.theme=localStorage.getItem('fadena_theme')||'graphite';render();refresh();
</script></body></html>
